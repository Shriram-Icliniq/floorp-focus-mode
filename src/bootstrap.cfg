// Custom Focus Mode loader. Removing defaults/pref/custom-focus-mode.js disables it.
try {
  const supportedBuild = "__SUPPORTED_BUILD_ID__";
  if (Services.appinfo.appBuildID !== supportedBuild)
    throw new Error("Unsupported Floorp build; Custom Focus Mode left off. Revalidate after updating.");
  const platformFile = Services.dirsvc.get("GreD", Ci.nsIFile);
  platformFile.append("platform.ini");
  const platformINI = Cc["@mozilla.org/xpcom/ini-parser-factory;1"]
    .getService(Ci.nsIINIParserFactory).createINIParser(platformFile);
  if (platformINI.getString("Build", "BuildID") !== "__SUPPORTED_PACKAGE_BUILD_ID__")
    throw new Error("Floorp package updated; Custom Focus Mode left off pending validation.");
  const { FileUtils } = ChromeUtils.importESModule("resource://gre/modules/FileUtils.sys.mjs");
  const folder = new FileUtils.File(__DATA_DIRECTORY__);
  Services.io.getProtocolHandler("resource").QueryInterface(Ci.nsIResProtocolHandler)
    .setSubstitution("custom-focus-mode", Services.io.newFileURI(folder));
  const marker = Services.dirsvc.get("ProfD", Ci.nsIFile);
  marker.append("custom-focus-mode.enabled");
  if (marker.exists()) {
    ChromeUtils.registerWindowActor("FocusCommandLine", {
      parent: { esModuleURI: "resource://custom-focus-mode/CommandLineParent.sys.mjs" },
      child: {
        esModuleURI: "resource://custom-focus-mode/CommandLineChild.sys.mjs",
        events: { keydown: { capture: false, mozSystemGroup: true } },
      },
      allFrames: true,
      includeParent: true,
      includeChrome: true,
      safeForUntrustedWebProcess: true,
      // Cover every tab protocol/process, including non-remote internal pages.
      // The child ignores browser UI contexts; the parent verifies the tab.
    });
    const attach = win => {
      if (win.document.documentURI !== "chrome://browser/content/browser.xhtml" ||
          win.__customFocusBootstrapped) return;
      win.__customFocusBootstrapped = true;
      const script = win.document.createElementNS("http://www.w3.org/1999/xhtml", "script");
      script.type = "module";
      script.src = "resource://custom-focus-mode/palette.mjs";
      script.addEventListener("error", () => {
        Services.console.logStringMessage("Custom Focus Mode: palette adapter failed; normal interface retained.");
      }, { once: true });
      win.document.documentElement.appendChild(script);
      const start = () => {
        if (!win.gBrowser || !win.__focusModePaletteRegistered) return;
        try {
          Services.scriptloader.loadSubScript("resource://custom-focus-mode/focus-mode.js", win, "UTF-8");
          const style = win.document.createElementNS("http://www.w3.org/1999/xhtml", "link");
          style.id = "custom-focus-mode-style";
          style.rel = "stylesheet";
          style.href = "resource://custom-focus-mode/focus-mode.css";
          style.addEventListener("load", () => win.FocusMode?.ready(), { once: true });
          style.addEventListener("error", () => win.FocusMode?.destroy(), { once: true });
          win.document.documentElement.appendChild(style);
        } catch (error) {
          win.FocusMode?.destroy();
          Services.console.logStringMessage("Custom Focus Mode initialization failed: " + error);
        }
      };
      if (win.gBrowserInit?.delayedStartupFinished) start();
      else {
        const observer = subject => {
          if (subject !== win) return;
          Services.obs.removeObserver(observer, "browser-delayed-startup-finished");
          start();
        };
        Services.obs.addObserver(observer, "browser-delayed-startup-finished");
      }
      // Both modules are asynchronous; either one may finish first.
      win.addEventListener("custom-focus-palette-ready", () => {
        if (win.gBrowserInit?.delayedStartupFinished && !win.FocusMode) start();
      }, { once: true });
    };
    Services.obs.addObserver(doc => {
      if (doc.documentURI === "chrome://browser/content/browser.xhtml") attach(doc.defaultView);
    }, "document-element-inserted");
  }
} catch (error) {
  try { console.error("Custom Focus Mode loader failed", error); } catch {}
}
